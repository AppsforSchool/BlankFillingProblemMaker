<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社会　問題エディタ ― 検査問題ジェネレーター</title>
<link rel="stylesheet" href="style.css">
<!-- 画像・PDF書き出し用の外部ライブラリ（バニラJSのみで自作するのが困難な部分のみCDNを利用） -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="topbar">
  <h1>社会　問題エディタ</h1>
  <div class="file-actions">
    <button class="btn" id="save-json-btn">保存(JSON)</button>
    <button class="btn" id="load-json-btn">読み込み(JSON)</button>
    <input type="file" id="json-file-input" accept="application/json" style="display:none;">
  </div>
</div>

<div class="layout">

  <!-- ============ 編集パネル ============ -->
  <div class="editor-panel">
    <h2>出力オプション</h2>
    <div class="cover-fields">
      <label class="option-toggle">
        <input type="checkbox" id="toggle-answerkey">
        末尾に解答一覧を付ける
      </label>
    </div>

    <h2>問題一覧</h2>
    <div class="add-row">
      <button class="btn light" id="add-question-btn">＋ 問題を追加</button>
      <button class="btn light" id="load-sample-btn">サンプルを読み込む</button>
      <button class="btn light" id="clear-all-btn">全て削除</button>
    </div>

    <div id="editor-list"></div>
  </div>

  <!-- ============ プレビュー ============ -->
  <div class="preview-panel">
    <div class="export-bar">
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn primary" id="export-png-btn">画像として書き出す (PNG)</button>
        <button class="btn primary" id="export-pdf-btn">PDFとして書き出す</button>
        <button class="btn light" id="print-btn">印刷してPDF保存</button>
      </div>
      <div class="export-note">※「印刷してPDF保存」はブラウザの印刷ダイアログでページ区切りがきれいに入ります。</div>
    </div>

    <div class="sheet-scroll">
      <div class="sheet" id="preview-sheet">
        <!-- JSで動的に生成 -->
      </div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
